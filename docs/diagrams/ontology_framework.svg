<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lbl{fill:#0f172a;font-weight:600;}
      .sub{fill:#334155;font-size:12px;}
      .tag{fill:#ffffff;font-size:11px;font-weight:700;}
      .box{rx:10;stroke-width:1.5;}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow);}
      .title{fill:#0f172a;font-size:20px;font-weight:700;}
      .note{fill:#7f1d1d;font-size:12px;font-weight:600;}
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="760" fill="#f8fafc"/>
  <text x="40" y="42" class="title">Hybrid RDF / RDFS / OWL + SHACL Ontology Framework</text>
  <text x="40" y="64" class="sub">Additive layer over the existing pipeline — OWL categorizes, SHACL validates, Python scores, RiskManager decides.</text>

  <!-- Layer boxes -->
  <!-- 1 Data -->
  <rect x="40" y="90" width="560" height="58" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="60" y="116" class="lbl">1 · Data Ingestion &amp; Feature Generation</text>
  <text x="60" y="136" class="sub">Market · account · broker quotes · macro · news · disclosure · indicators · NPU/CPU scores</text>
  <rect x="470" y="104" width="118" height="30" rx="6" fill="#10b981"/>
  <text x="481" y="124" class="tag">unchanged</text>

  <!-- 2 RDF assertion -->
  <rect x="40" y="168" width="560" height="58" class="box" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="60" y="194" class="lbl">2 · RDF Assertion Graph</text>
  <text x="60" y="214" class="sub">rdf_graph · rdf_adapter — stable IRIs (res:/ev:), Triple→RDF, evidence provenance</text>

  <!-- 3 Schema -->
  <rect x="40" y="246" width="560" height="58" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="60" y="272" class="lbl">3 · RDFS / OWL Schema</text>
  <text x="60" y="292" class="sub">trading_core.ttl — classes, subClassOf/subPropertyOf, domain/range, disjointness</text>

  <!-- 4 OWL RL -->
  <rect x="40" y="324" width="560" height="58" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="60" y="350" class="lbl">4 · OWL RL Materialization</text>
  <text x="60" y="370" class="sub">owl_reasoner · semantic_materializer — trading_rules.ttl classification (owlrl)</text>
  <rect x="470" y="338" width="118" height="30" rx="6" fill="#7c3aed"/>
  <text x="486" y="358" class="tag">semantics</text>

  <!-- 5 SHACL -->
  <rect x="40" y="402" width="560" height="58" class="box" fill="#eff6ff" stroke="#0ea5e9"/>
  <text x="60" y="428" class="lbl">5 · SHACL Validation</text>
  <text x="60" y="448" class="sub">shacl_validator · trading_shapes.ttl — stale/synthetic block (live), required fields</text>
  <rect x="470" y="416" width="118" height="30" rx="6" fill="#0ea5e9"/>
  <text x="483" y="436" class="tag">closed-world</text>

  <!-- 6 Python scorer -->
  <rect x="40" y="480" width="560" height="58" class="box" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="60" y="506" class="lbl">6 · Python Semantic Policy Scorer</text>
  <text x="60" y="526" class="sub">SemanticPolicyScorer — support/contradiction/risk, confidence, ranking, thresholds</text>
  <rect x="470" y="494" width="118" height="30" rx="6" fill="#f59e0b"/>
  <text x="497" y="514" class="tag">numbers</text>

  <!-- 7 Safety -->
  <rect x="40" y="558" width="560" height="72" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="584" class="lbl">7 · Trading Safety &amp; Execution Gate</text>
  <text x="60" y="604" class="sub">TradingCostEngine → PrincipalProtectionEngine → RiskManager → live-readiness</text>
  <rect x="470" y="572" width="118" height="30" rx="6" fill="#dc2626"/>
  <text x="486" y="592" class="tag">final gate</text>

  <!-- Final order -->
  <rect x="200" y="662" width="240" height="46" rx="10" fill="#111827"/>
  <text x="245" y="690" fill="#ffffff" font-size="16" font-weight="700">FinalOrder (approved)</text>

  <!-- flow arrows down -->
  <path class="flow" d="M320,148 L320,166"/>
  <path class="flow" d="M320,226 L320,244"/>
  <path class="flow" d="M320,304 L320,322"/>
  <path class="flow" d="M320,382 L320,400"/>
  <path class="flow" d="M320,460 L320,478"/>
  <path class="flow" d="M320,538 L320,556"/>
  <path class="flow" d="M320,630 L320,660"/>

  <!-- side annotation panel -->
  <rect x="640" y="90" width="300" height="540" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="660" y="120" class="lbl">Reasoning boundary</text>
  <circle cx="668" cy="150" r="6" fill="#7c3aed"/><text x="684" y="155" class="sub">OWL — class/property hierarchy, typing, semantic categorization, consistency</text>
  <circle cx="668" cy="200" r="6" fill="#0ea5e9"/><text x="684" y="205" class="sub">SHACL — required fields, stale/synthetic blocking, invalid state (closed-world)</text>
  <circle cx="668" cy="250" r="6" fill="#f59e0b"/><text x="684" y="255" class="sub">Python — scoring, ranking, thresholds, short-horizon policy</text>
  <circle cx="668" cy="300" r="6" fill="#dc2626"/><text x="684" y="305" class="sub">RiskManager — the sole final execution authority</text>

  <line x1="660" y1="330" x2="920" y2="330" stroke="#e2e8f0"/>
  <text x="660" y="360" class="lbl" font-size="14">Why OWL never approves trades</text>
  <text x="660" y="384" class="sub">OWL is open-world: missing data is</text>
  <text x="660" y="402" class="sub">unknown, not false — so it cannot</text>
  <text x="660" y="420" class="sub">conclude an asset is safe.</text>

  <rect x="660" y="446" width="260" height="160" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="676" y="472" class="note">Guardrails</text>
  <text x="676" y="496" class="sub">• Advisory only — no order generation</text>
  <text x="676" y="516" class="sub">• Inferred labels ≠ permission to trade</text>
  <text x="676" y="536" class="sub">• Never fail open on live path</text>
  <text x="676" y="556" class="sub">• KnowledgeGraph + GUI fields preserved</text>
  <text x="676" y="576" class="sub">• Cost/tax/sizing stay in Python engines</text>
  <text x="676" y="596" class="sub">• Enable/disable via ONTOLOGY_RDF_LAYER</text>
</svg>
