<svg xmlns='http://www.w3.org/2000/svg' width='900' height='320' viewBox='0 0 900 320'>
<rect width='900' height='320' fill='#ffffff'/>
<text x='450' y='34' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='700' fill='#1b1f24' text-anchor='middle'>DynamicExitPolicy — unified thresholds + loss-exit governance</text>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#8b949e'/></marker></defs>
<rect x='30' y='80' width='200' height='60' rx='10' fill='#1a7f37'/>
<text x='130' y='106' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle'>Resolved exit policy</text>
<text x='130' y='124' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#ffffff' text-anchor='middle'>logged once</text>
<text x='40' y='165' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#1b1f24' text-anchor='start'>Dynamic (cost/vol/liquidity/spread aware):</text>
<text x='40' y='185' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>take-profit, profit-lock, trailing giveback, soft-stop</text>
<text x='40' y='205' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>Capital circuit-breakers: hard-stop, emergency-stop</text>
<text x='40' y='240' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#9a6700' text-anchor='start'>Env overrides honored (backward parity); logged.</text>
<rect x='470' y='70' width='200' height='54' rx='10' fill='#1b1f24'/>
<text x='570' y='102' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle'>Loss-exit decision</text>
<rect x='470' y='150' width='190' height='48' rx='10' fill='#cf222e'/>
<text x='565' y='170' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle'>BLOCK</text>
<text x='565' y='188' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#ffffff' text-anchor='middle'>noise band / no evidence</text>
<rect x='680' y='150' width='190' height='48' rx='10' fill='#1a7f37'/>
<text x='775' y='170' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle'>ALLOW</text>
<text x='775' y='188' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#ffffff' text-anchor='middle'>strong deterioration</text>
<line x1='540' y1='124' x2='560' y2='150' stroke='#cf222e' stroke-width='2' marker-end='url(#arrow)'/>
<line x1='600' y1='124' x2='760' y2='150' stroke='#1a7f37' stroke-width='2' marker-end='url(#arrow)'/>
<text x='680' y='218' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>hard/emergency stop, ontology SELL/REDUCE</text>
<text x='680' y='234' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>dominance, strong negative forecast,</text>
<text x='680' y='250' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#57606a' text-anchor='start'>liquidity/regime, daily-loss budget</text>
<text x='470' y='285' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#1b1f24' text-anchor='start'>Losers no longer always-held or always-dumped — exit on evidence, hold through noise.</text>
</svg>
