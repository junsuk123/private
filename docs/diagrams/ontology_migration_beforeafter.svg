<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .h{fill:#0f172a;font-size:19px;font-weight:700;}
      .col{fill:#0f172a;font-size:15px;font-weight:700;text-anchor:middle;}
      .r{fill:#334155;font-size:12px;}
      .rt{fill:#0f172a;font-size:12.5px;font-weight:600;}
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="520" fill="#f8fafc"/>
  <text x="40" y="40" class="h">Migration — Custom Triple Store → Standards-Based Ontology</text>

  <!-- BEFORE -->
  <rect x="40" y="70" width="420" height="410" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="250" y="98" class="col">BEFORE (custom, in-memory)</text>
  <g>
    <rect x="64" y="120" width="372" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="78" y="141" class="rt">KnowledgeGraph</text><text x="78" y="160" class="r">list[Triple] of bare (s, p, o, evidence_id) strings</text>
    <rect x="64" y="184" width="372" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="78" y="205" class="rt">ontology.py</text><text x="78" y="224" class="r">22 class + 19 predicate NAME strings in flat tuples</text>
    <rect x="64" y="248" width="372" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="78" y="269" class="rt">OntologyReasoner</text><text x="78" y="288" class="r">rule-based weight sums (mis-named "reasoner")</text>
    <rect x="64" y="312" width="372" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="78" y="333" class="rt">evidence_id: str</text><text x="78" y="352" class="r">single string per triple; no formal provenance</text>
    <rect x="64" y="376" width="372" height="84" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="78" y="400" class="rt">Missing</text>
    <text x="78" y="420" class="r">no IRIs · no hierarchy · no OWL reasoner</text>
    <text x="78" y="438" class="r">no SHACL · no SPARQL · no named graphs</text>
  </g>

  <!-- arrow -->
  <path d="M470,275 L568,275" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#a3)"/>
  <text x="520" y="262" fill="#7c3aed" font-size="12" font-weight="700" text-anchor="middle">map</text>

  <!-- AFTER -->
  <rect x="580" y="70" width="420" height="410" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="790" y="98" class="col">AFTER (standards-based, additive)</text>
  <g>
    <rect x="604" y="120" width="372" height="52" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="618" y="141" class="rt">RdfTradingGraph (rdflib)</text><text x="618" y="160" class="r">stable IRIs tr:/res:/ev: · named graphs</text>
    <rect x="604" y="184" width="372" height="52" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="618" y="205" class="rt">trading_core.ttl</text><text x="618" y="224" class="r">RDFS/OWL classes, hierarchy, domain/range, disjoint</text>
    <rect x="604" y="248" width="372" height="52" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="618" y="269" class="rt">SemanticPolicyScorer + OWL RL</text><text x="618" y="288" class="r">Python scoring + owlrl categorization (rules.ttl)</text>
    <rect x="604" y="312" width="372" height="52" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="618" y="333" class="rt">tr:EvidenceItem individuals</text><text x="618" y="352" class="r">source · type · time · quality · synthetic/stale · cycle</text>
    <rect x="604" y="376" width="372" height="84" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="618" y="400" class="rt">Added</text>
    <text x="618" y="420" class="r">SHACL validation (trading_shapes.ttl)</text>
    <text x="618" y="438" class="r">Turtle/JSON-LD serialization · GUI asserted-vs-inferred</text>
  </g>
</svg>
