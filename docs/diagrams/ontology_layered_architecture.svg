<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .t{fill:#0f172a;font-size:12.5px;font-weight:700;text-anchor:middle;}
      .s{fill:#334155;font-size:10.5px;text-anchor:middle;}
      .f{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a2);}
      .h{fill:#0f172a;font-size:19px;font-weight:700;}
      .cap{fill:#334155;font-size:12px;}
    </style>
  </defs>
  <rect x="0" y="0" width="1120" height="420" fill="#f8fafc"/>
  <text x="40" y="40" class="h">Layered Ontology Architecture — End-to-End Flow</text>
  <text x="40" y="62" class="cap">Data → RDF Assertion → RDFS/OWL Schema → OWL RL → SHACL → Python Scorer → Cost → Principal → RiskManager → FinalOrder</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="96" width="150" height="70" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="115" y="126" class="t">Typed Records</text><text x="115" y="146" class="s">market · account · news</text>
    <rect x="230" y="96" width="150" height="70" rx="10" fill="#f0fdfa" stroke="#14b8a6"/>
    <text x="305" y="126" class="t">RDF Assertion</text><text x="305" y="146" class="s">stable IRIs · evidence</text>
    <rect x="420" y="96" width="150" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="495" y="126" class="t">RDFS/OWL Schema</text><text x="495" y="146" class="s">trading_core.ttl</text>
    <rect x="610" y="96" width="150" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="685" y="126" class="t">OWL RL Closure</text><text x="685" y="146" class="s">trading_rules.ttl</text>
    <rect x="800" y="96" width="150" height="70" rx="10" fill="#eff6ff" stroke="#0ea5e9"/>
    <text x="875" y="126" class="t">SHACL Validation</text><text x="875" y="146" class="s">trading_shapes.ttl</text>
  </g>
  <path class="f" d="M190,131 L228,131"/>
  <path class="f" d="M380,131 L418,131"/>
  <path class="f" d="M570,131 L608,131"/>
  <path class="f" d="M760,131 L798,131"/>
  <!-- down connector -->
  <path class="f" d="M875,166 L875,210 L495,210 L495,244"/>

  <!-- row 2 -->
  <g>
    <rect x="420" y="248" width="150" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="495" y="278" class="t">Python Scorer</text><text x="495" y="298" class="s">confidence · ranking</text>
    <rect x="610" y="248" width="150" height="70" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="685" y="272" class="t">TradingCost +</text><text x="685" y="290" class="t">PrincipalProtection</text><text x="685" y="308" class="s">fees · tax · sizing</text>
    <rect x="800" y="248" width="150" height="70" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="875" y="278" class="t">RiskManager</text><text x="875" y="298" class="s">sole final gate</text>
    <rect x="985" y="248" width="120" height="70" rx="10" fill="#111827"/>
    <text x="1045" y="286" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">FinalOrder</text>
  </g>
  <path class="f" d="M570,283 L608,283"/>
  <path class="f" d="M760,283 L798,283"/>
  <path class="f" d="M950,283 L983,283"/>

  <text x="495" y="360" class="s">OWL-inferred classes feed the scorer as EXTRA features — never as the sole decision source.</text>
  <text x="875" y="360" class="s">Inferred eligibility ≠ permission; RiskManager decides.</text>
</svg>
