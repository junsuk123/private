<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="Segoe UI, Noto Sans KR, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{fill:#0f172a;font-size:30px;font-weight:800}
      .subtitle{fill:#475569;font-size:15px}
      .box{rx:12;stroke-width:1.8}
      .h{fill:#0f172a;font-size:18px;font-weight:800}
      .t{fill:#334155;font-size:13px}
      .small{fill:#64748b;font-size:12px}
      .note{fill:#7f1d1d;font-size:12px;font-weight:700}
      .lane{fill:#e2e8f0;font-size:13px;font-weight:800}
      .flow{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .badge{fill:#fff;font-size:13px;font-weight:800}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="52" y="52">Personal Investment Agent - Current Runtime Architecture</text>
  <text class="subtitle" x="52" y="79">KIS realtime data, ontology/ML evidence, deterministic risk gates, web dashboard, and Raspberry Pi CPU-only kiosk share one guarded control plane.</text>

  <rect x="38" y="112" width="1524" height="208" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lane" x="62" y="140">DATA AND TRUST LAYER</text>

  <rect class="box" x="62" y="165" width="220" height="120" fill="#ecfdf5" stroke="#10b981"/>
  <circle cx="88" cy="190" r="13" fill="#10b981"/><text class="badge" x="84" y="195">1</text>
  <text class="h" x="110" y="195">Live Inputs</text>
  <text class="t" x="82" y="222">KIS account, balances, orders</text>
  <text class="t" x="82" y="241">Realtime ticks and orderbooks</text>
  <text class="t" x="82" y="260">Broker quotes and FX</text>

  <rect class="box" x="324" y="165" width="220" height="120" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="350" cy="190" r="13" fill="#3b82f6"/><text class="badge" x="346" y="195">2</text>
  <text class="h" x="372" y="195">Research Inputs</text>
  <text class="t" x="344" y="222">Market, macro, news, disclosure</text>
  <text class="t" x="344" y="241">US/overseas and KRX universe</text>
  <text class="t" x="344" y="260">Optional local LLM sentiment</text>

  <rect class="box" x="586" y="165" width="250" height="120" fill="#fefce8" stroke="#eab308"/>
  <circle cx="612" cy="190" r="13" fill="#eab308"/><text class="badge" x="608" y="195">3</text>
  <text class="h" x="634" y="195">Validation + Storage</text>
  <text class="t" x="606" y="222">Source trust, freshness, provenance</text>
  <text class="t" x="606" y="241">Synthetic/stale/unknown rejection</text>
  <text class="t" x="606" y="260">SQLite store, raw archive, audit logs</text>

  <rect class="box" x="878" y="165" width="250" height="120" fill="#eef2ff" stroke="#6366f1"/>
  <circle cx="904" cy="190" r="13" fill="#6366f1"/><text class="badge" x="900" y="195">4</text>
  <text class="h" x="926" y="195">Feature Frame</text>
  <text class="t" x="898" y="222">Indicators, spread, liquidity, flow</text>
  <text class="t" x="898" y="241">Short-horizon labels and artifacts</text>
  <text class="t" x="898" y="260">Live feature provenance</text>

  <rect class="box" x="1170" y="165" width="250" height="120" fill="#fdf2f8" stroke="#db2777"/>
  <circle cx="1196" cy="190" r="13" fill="#db2777"/><text class="badge" x="1192" y="195">5</text>
  <text class="h" x="1218" y="195">Account Snapshot</text>
  <text class="t" x="1190" y="222">Holdings, cash by currency, PnL</text>
  <text class="t" x="1190" y="241">Asset history and quality warnings</text>
  <text class="t" x="1190" y="260">Feeds /account and risk gates</text>

  <path class="flow" d="M282 225 L324 225"/>
  <path class="flow" d="M544 225 L586 225"/>
  <path class="flow" d="M836 225 L878 225"/>
  <path class="flow" d="M1128 225 L1170 225"/>

  <rect x="38" y="358" width="1524" height="248" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="lane" x="62" y="386">REASONING AND CONTROL LAYER</text>

  <rect class="box" x="92" y="416" width="240" height="130" fill="#fff7ed" stroke="#f97316"/>
  <circle cx="118" cy="442" r="13" fill="#f97316"/><text class="badge" x="114" y="447">6</text>
  <text class="h" x="140" y="447">Candidate Filter</text>
  <text class="t" x="112" y="476">Hard rejects for halted, stale,</text>
  <text class="t" x="112" y="495">illiquid, unaffordable symbols</text>
  <text class="t" x="112" y="514">Top-K ranking for heavier scoring</text>

  <rect class="box" x="388" y="416" width="250" height="130" fill="#f5f3ff" stroke="#7c3aed"/>
  <circle cx="414" cy="442" r="13" fill="#7c3aed"/><text class="badge" x="410" y="447">7</text>
  <text class="h" x="436" y="447">NPU/CPU Evidence</text>
  <text class="t" x="408" y="476">OpenVINO NPU on Windows when present</text>
  <text class="t" x="408" y="495">CPU/NumPy fallback everywhere</text>
  <text class="note" x="408" y="518">Evidence only, never authorization</text>

  <rect class="box" x="694" y="416" width="250" height="130" fill="#ecfeff" stroke="#06b6d4"/>
  <circle cx="720" cy="442" r="13" fill="#06b6d4"/><text class="badge" x="716" y="447">8</text>
  <text class="h" x="742" y="447">Ontology Reasoning</text>
  <text class="t" x="714" y="476">RDF/RDFS/OWL semantic labels</text>
  <text class="t" x="714" y="495">SHACL operational validation</text>
  <text class="t" x="714" y="514">Python policy scoring and paths</text>

  <rect class="box" x="1000" y="416" width="250" height="130" fill="#ecfdf5" stroke="#059669"/>
  <circle cx="1026" cy="442" r="13" fill="#059669"/><text class="badge" x="1022" y="447">9</text>
  <text class="h" x="1048" y="447">Decision Engine</text>
  <text class="t" x="1020" y="476">SELL/REDUCE before BUY</text>
  <text class="t" x="1020" y="495">Open SELL keep/amend logic</text>
  <text class="t" x="1020" y="514">Model is advisory-only by default</text>

  <rect class="box" x="1306" y="416" width="220" height="130" fill="#fee2e2" stroke="#ef4444"/>
  <circle cx="1332" cy="442" r="13" fill="#ef4444"/><text class="badge" x="1328" y="447">10</text>
  <text class="h" x="1354" y="447">Final Gates</text>
  <text class="t" x="1326" y="476">RiskManager, cost, principal,</text>
  <text class="t" x="1326" y="495">freshness, idempotency, KIS gates</text>
  <text class="t" x="1326" y="514">Limit orders only</text>

  <path class="flow" d="M332 481 L388 481"/>
  <path class="flow" d="M638 481 L694 481"/>
  <path class="flow" d="M944 481 L1000 481"/>
  <path class="flow" d="M1250 481 L1306 481"/>
  <path class="dash" d="M1003 285 C1003 338 212 338 212 416"/>
  <path class="dash" d="M1295 285 C1295 348 1416 348 1416 416"/>

  <rect x="38" y="644" width="1524" height="260" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="lane" x="62" y="672">EXECUTION AND GUI LAYER</text>

  <rect class="box" x="82" y="708" width="240" height="130" fill="#fff" stroke="#64748b"/>
  <circle cx="108" cy="734" r="13" fill="#64748b"/><text class="badge" x="104" y="739">11</text>
  <text class="h" x="130" y="739">Execution Adapter</text>
  <text class="t" x="102" y="768">Mock, paper, or KIS live broker</text>
  <text class="t" x="102" y="787">LiveExecutionCoordinator</text>
  <text class="t" x="102" y="806">Order journal and status tracking</text>

  <rect class="box" x="378" y="708" width="250" height="130" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="404" cy="734" r="13" fill="#2563eb"/><text class="badge" x="400" y="739">12</text>
  <text class="h" x="426" y="739">Web GUI</text>
  <text class="t" x="398" y="768">/account: assets, cash, holdings</text>
  <text class="t" x="398" y="787">decision flow and rejection reasons</text>
  <text class="t" x="398" y="806">termination disables BUY first</text>

  <rect class="box" x="684" y="708" width="250" height="130" fill="#f0fdf4" stroke="#16a34a"/>
  <circle cx="710" cy="734" r="13" fill="#16a34a"/><text class="badge" x="706" y="739">13</text>
  <text class="h" x="732" y="739">Pi Runtime</text>
  <text class="t" x="704" y="768">CPU-only run.sh on 0.0.0.0:8010</text>
  <text class="t" x="704" y="787">Read-only defaults, optional live flags</text>
  <text class="t" x="704" y="806">Shared data/store and model artifacts</text>

  <rect class="box" x="990" y="708" width="250" height="130" fill="#fefce8" stroke="#ca8a04"/>
  <circle cx="1016" cy="734" r="13" fill="#ca8a04"/><text class="badge" x="1012" y="739">14</text>
  <text class="h" x="1038" y="739">Pi Kiosk GUI</text>
  <text class="t" x="1010" y="768">/display trade-reason board</text>
  <text class="t" x="1010" y="787">/display/ontology graph view</text>
  <text class="t" x="1010" y="806">Chromium kiosk launcher for LCD</text>

  <rect class="box" x="1296" y="708" width="220" height="130" fill="#faf5ff" stroke="#9333ea"/>
  <circle cx="1322" cy="734" r="13" fill="#9333ea"/><text class="badge" x="1318" y="739">15</text>
  <text class="h" x="1344" y="739">Feedback</text>
  <text class="t" x="1316" y="768">Audit logs, readiness reports</text>
  <text class="t" x="1316" y="787">live model retraining artifacts</text>
  <text class="t" x="1316" y="806">dashboard history snapshots</text>

  <path class="flow" d="M1416 546 C1416 610 202 610 202 708"/>
  <path class="flow" d="M322 773 L378 773"/>
  <path class="dash" d="M628 773 L684 773"/>
  <path class="dash" d="M934 773 L990 773"/>
  <path class="dash" d="M1240 773 L1296 773"/>
  <path class="dash" d="M1406 838 C1406 936 202 936 202 838"/>

  <text class="small" x="62" y="936">Safety invariant: LLM, ontology, NPU, and ML components can classify, rank, explain, and advise. Only deterministic runtime gates can create and submit a FinalOrder.</text>
</svg>
