# Unified profitability-gate policy (Phase 1 refactor).
#
# This is the SINGLE authoritative source for the net-profitability BUY rule used by
# the strategy candidate factory, the RiskManager BUY path, the realtime trading
# engine, and the GUI. A BUY is allowed only when its expected NET return after ALL
# costs clears a dynamic minimum edge.
#
# Precedence (highest wins), resolved values are logged once at startup:
#   1. Environment variables (backward compatible with existing REALTIME_* vars)
#   2. this file
#   3. built-in defaults in src/app/cost/profitability_gate.py
#
# These are INITIAL defaults to be tuned from realized PnL/execution logs — they are
# not assumed universally optimal. See docs/decision_and_risk.md.

# Minimum acceptable net expected return (after all costs) by market.
# Overridable by REALTIME_MIN_BUY_NET_RETURN_KR / REALTIME_MIN_BUY_NET_RETURN_US.
min_required_net_return:
  default: 0.0
  KR: 0.0
  # One-share US live probing should still require positive net expectancy after
  # all fees/slippage, but not a full 20 bps extra floor on top of that. Today's
  # live candidates included several +6~7 bps net names that were rejected solely
  # by this floor, leaving no BUY submissions despite sufficient cash.
  US: 0.0003

# Extra net headroom demanded above pure break-even before a buy is worth taking.
# Overridable by REALTIME_MIN_NET_PROFIT_BUFFER_RATE.
min_net_profit_buffer_rate: 0.0

# Absolute spread ceiling as a fraction of mid ((ask-bid)/mid).
max_spread_rate: 0.003

# Expected entry-slippage ceiling as a fraction of notional (hard reject).
max_slippage_rate: 0.003

# Execution quality: spread may not consume more than this fraction of gross alpha.
max_spread_alpha_ratio: 0.35

# Cost may not dominate alpha beyond this ratio (all_in_cost_rate / |gross_return|).
# Relaxed 0.5 -> 0.7 (moderate) so realistic ~0.7-0.9% expected moves on a small
# account are not blocked by COST_BURDEN_HIGH while clearly cost-dominated trades
# (cost > 70% of alpha) are still rejected.
#
# NOTE: 1.05 permits a trade whose cost EXCEEDS its alpha. It is kept only as the
# outer bound; the binding rule is now min_cost_coverage_ratio below, which states
# the same constraint from the coverage side and demands a real safety margin.
max_cost_to_alpha_ratio: 1.05

# --- Cost coverage ------------------------------------------------------------------
# CostCoverageRatio = predicted_gross_edge_bps / expected_all_in_cost_bps.
#
# Measured motivation: with coverage allowed down to ~0.95 the realized population
# was gross-positive / net-negative, i.e. the edge existed but never survived its
# own cost. Both terms are estimates, so equality is a loss in expectation.
#
#   < 1.0    cost not covered                  -> never
#   1.0-1.3  covered but inside the error bars  -> never
#   1.3-1.7  real but thin                      -> minimum size
#   >= 1.7   worth taking                       -> live candidate
#
# The final gate recomputes actual all-in cost. Equality is not enough because
# both edge and cost are estimates; require the documented live boundary while
# retaining the 1.3-1.7 band for minimum-size execution.
min_cost_coverage_ratio: 1.3
cost_coverage:
  covered: 1.0
  live: 1.3
  comfortable: 1.7

# Liquidity floor (0..1 normalized score).
min_liquidity_score: 0.3

# --- Dynamic required-net-return buffers -------------------------------------------
# required_min_net_return = max(
#     min_required_net_return[market],
#     min_net_profit_buffer_rate
#       + volatility_buffer_k * realized_volatility
#       + liquidity_buffer_max * (1 - liquidity_score)
#       + account_buffer(if small account),
# )
# Keep the extra buffers light for one-share live probing: the hard rules still require
# positive net expectancy after costs, liquidity >= min_liquidity_score, and bounded
# cost/alpha. A larger liquidity buffer was rejecting today's positive-net US candidates
# by a few bps even after all-in costs were covered.
volatility_buffer_k: 0.05
liquidity_buffer_max: 0.001

account_buffer:
  small_account_equity_krw: 200000.0
  # 0.002 -> 0.0 (moderate): stop demanding an extra 0.2% net purely for being a
  # small account; the market floor + cost/alpha rule already protect against bleed.
  small_account_extra_net: 0.0
