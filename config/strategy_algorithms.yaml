# Per-strategy mechanical entry/exit thresholds.
#
# The ontology (and an authorised GNN) elect ONE symbol and ONE strategy; the
# elected algorithm in src/app/technical/strategy_algorithms.py then owns entry
# timing, stop/target geometry and thesis invalidation. Regime, liquidity,
# volatility and spread admissibility are NOT here — they are resolved once at
# election time and then watched by src/app/trading/strategy_supervisor.py.
#
# Precedence (highest wins), resolved values exposed via AlgorithmConfig.as_dict():
#   1. environment  ALGO_<SECTION>_<KEY>  (upper case)
#   2. this file
#   3. built-in defaults in strategy_algorithms.py
#
# These are STARTING values to be tuned from realized net PnL. They are not
# assumed optimal. In particular: KRX round-trip cost (sell tax 15 bps + fees +
# spread) is roughly 25-30 bps, so any strategy whose expected edge sits below
# that will be — correctly — rejected downstream by the ProfitabilityGate.

shared:
  # Fraction of the volatility-implied move we expect to actually capture.
  # Never raise above 1.0; there is deliberately no fabricated alpha floor.
  capture_fraction: 0.5
  # Minimum ticks in the 5s window before any mechanical trigger may fire.
  min_tick_count_5s: 3.0
  # Algorithm-level edge floor in bps. This is a sanity floor only — the
  # authoritative net-of-cost decision stays with the ProfitabilityGate.
  min_expected_edge_bps: 8.0

# Tick order-flow continuation, confirmed by bar trend agreement.
intraday_momentum:
  min_aggressor_imbalance: 0.15
  min_return_5s_bps: 2.0
  horizon_seconds: 180.0
  stop_volatility_multiple: 1.5
  trailing_bps: 12.0
  reverse_aggressor_exit: -0.25

# Structural range break; stop sits at the broken level, not at a bps constant.
breakout_volume:
  min_volume_spike_ratio: 1.5
  acceptance_return_1s_bps: 0.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 300.0
  stop_buffer_bps: 8.0
  trailing_bps: 15.0
  failure_tolerance_bps: 10.0

# Displacement below VWAP; target is VWAP itself, never an arbitrary bps target.
vwap_mean_reversion:
  entry_deviation_bps: 25.0
  max_rsi: 38.0
  max_percent_b: 0.22
  horizon_seconds: 240.0
  stop_volatility_multiple: 2.0
  target_capture_fraction: 0.7
  trailing_bps: 10.0

# Mechanical sub-minute drop; requires the spread to be contracting again.
liquidity_shock_reversal:
  shock_return_10s_bps: -40.0
  max_spread_change_5s: 0.0
  min_aggressor_imbalance: -0.35
  min_orderbook_imbalance: 0.0
  horizon_seconds: 120.0
  retrace_fraction: 0.4
  stop_buffer_bps: 6.0
  trailing_bps: 14.0

# TTL-bounded repricing. Requires a point-in-time event feed; without one the
# algorithm fails closed rather than guessing freshness.
event_momentum:
  min_volume_spike_ratio: 2.0
  min_aggressor_imbalance: 0.10
  exhaustion_return_10s_bps: 120.0
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 20.0

# Requires a cross-sectional rank from the electing layer.
cross_sectional_relative_strength:
  max_sector_rank: 3.0
  min_short_return_bps: 0.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 18.0

# Exactly one submode per election; continuation and fade are never blended.
gap_context:
  min_gap_rate: 0.01
  min_volume_spike_ratio: 1.5
  min_aggressor_imbalance: 0.10
  horizon_seconds: 300.0
  fill_capture_fraction: 0.5
  stop_buffer_bps: 10.0
  trailing_bps: 16.0
