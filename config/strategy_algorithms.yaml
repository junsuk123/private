# Per-strategy mechanical entry/exit thresholds.
#
# The ontology (and an authorised GNN) elect ONE symbol and ONE strategy; the
# elected algorithm in src/app/technical/strategy_algorithms.py then owns entry
# timing, stop/target geometry and thesis invalidation. Regime, liquidity,
# volatility and spread admissibility are NOT here — they are resolved once at
# election time and then watched by src/app/trading/strategy_supervisor.py.
#
# Precedence (highest wins), resolved values exposed via AlgorithmConfig.as_dict():
#   1. environment  ALGO_<SECTION>_<KEY>  (upper case)
#   2. this file
#   3. built-in defaults in strategy_algorithms.py
#
# These are STARTING values to be tuned from realized net PnL. They are not
# assumed optimal. In particular: KRX round-trip cost (sell tax 15 bps + fees +
# spread) is roughly 25-30 bps, so any strategy whose expected edge sits below
# that will be — correctly — rejected downstream by the ProfitabilityGate.

# Market intraday momentum: 하루 1회 왕복. KRX 왕복비용 27.8bps 중 20bps가 법정
# 거래세이고 이는 왕복마다 부과되므로, 전략의 왕복 횟수가 엣지만큼 중요하다.
# 변동성 게이트는 논문의 최강 조건이면서 동시에 비용 조건이다 — 조용한 날의
# 마지막 30분은 33bps를 움직이지 않는다. 15:20 종가 단일가 전에 반드시 청산.
market_intraday_momentum:
  min_first_half_hour_return_bps: 15.0
  min_first_half_hour_volatility_percentile: 0.6
  max_change_point_probability: 0.5
  trailing_bps: 30.0
  horizon_seconds: 1500.0

# Opening-range breakout, restricted to stocks in play by relative volume.
# The RVOL gate carries the published edge; loosening it below ~1.5 turns this
# into the unrestricted breakout, which the same research finds unprofitable.
opening_range_breakout:
  min_relative_volume: 1.5
  min_breakout_excess_bps: 3.0
  min_aggressor_imbalance: 0.05
  stop_buffer_bps: 8.0
  trailing_bps: 30.0
  horizon_seconds: 7200.0

shared:
  # Fraction of the volatility-implied move we expect to actually capture.
  # Never raise above 1.0; there is deliberately no fabricated alpha floor.
  capture_fraction: 0.5
  # Minimum ticks in the 5s window before any mechanical trigger may fire.
  min_tick_count_5s: 3.0
  # Algorithm-level edge floor in bps. This is a sanity floor only — the
  # authoritative net-of-cost decision stays with the ProfitabilityGate.
  min_expected_edge_bps: 8.0

# Tick order-flow continuation, confirmed by bar trend agreement.
intraday_momentum:
  min_aggressor_imbalance: 0.15
  min_return_5s_bps: 2.0
  horizon_seconds: 180.0
  stop_volatility_multiple: 1.5
  trailing_bps: 12.0
  reverse_aggressor_exit: -0.25

# Structural range break; stop sits at the broken level, not at a bps constant.
breakout_volume:
  min_volume_spike_ratio: 1.5
  acceptance_return_1s_bps: 0.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 300.0
  stop_buffer_bps: 8.0
  trailing_bps: 15.0
  failure_tolerance_bps: 10.0

# Displacement below VWAP; target is VWAP itself, never an arbitrary bps target.
vwap_mean_reversion:
  entry_deviation_bps: 25.0
  max_rsi: 38.0
  max_percent_b: 0.22
  horizon_seconds: 240.0
  stop_volatility_multiple: 2.0
  target_capture_fraction: 0.7
  trailing_bps: 10.0

# Mechanical sub-minute drop; requires the spread to be contracting again.
liquidity_shock_reversal:
  shock_return_10s_bps: -40.0
  max_spread_change_5s: 0.0
  min_aggressor_imbalance: -0.35
  min_orderbook_imbalance: 0.0
  horizon_seconds: 120.0
  retrace_fraction: 0.4
  stop_buffer_bps: 6.0
  trailing_bps: 14.0

# TTL-bounded repricing. Requires a point-in-time event feed; without one the
# algorithm fails closed rather than guessing freshness.
event_momentum:
  min_volume_spike_ratio: 2.0
  min_aggressor_imbalance: 0.10
  exhaustion_return_10s_bps: 120.0
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 20.0

# Requires a cross-sectional rank from the electing layer.
cross_sectional_relative_strength:
  max_sector_rank: 3.0
  min_short_return_bps: 0.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 18.0

# Exactly one submode per election; continuation and fade are never blended.
gap_context:
  min_gap_rate: 0.01
  min_volume_spike_ratio: 1.5
  min_aggressor_imbalance: 0.10
  horizon_seconds: 300.0
  fill_capture_fraction: 0.5
  stop_buffer_bps: 10.0
  trailing_bps: 16.0

# Bullish-only RVGI-confirmed breakout above a frozen causal 20-bar box.
rvgi_box_breakout:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  rvgi_period: 10
  box_lookback: 20
  cross_confirm_bars: 3
  entry_buffer_bps: 3.0
  max_extension_bps: 35.0
  min_volume_spike_ratio: 1.5
  min_aggressor_imbalance: 0.05
  min_box_width_pct: 0.002
  max_box_width_pct: 0.04
  target_capture_fraction: 0.5
  max_target_return: 0.012
  stop_buffer_bps: 10.0
  stop_atr_multiple: 1.0
  failure_tolerance_bps: 12.0
  trailing_bps: 15.0
  horizon_seconds: 300

# --- Added for the current high-volatility, flow-driven tape -----------------
# All three start with live_authorized: false. They run in shadow so the strategy
# performance store accumulates per-regime realized outcomes; the conservative
# bandit cannot give an arm a positive lower bound without those samples, so
# flipping live_authorized early would only produce a NO_TRADE anyway.

# Market/sector-neutral leadership. Requires residual returns and an investor-flow
# z-score from the electing layer; without them it fails closed rather than
# reverting to raw return (which is what made the non-residual version a market
# beta ranking in an index-dominated tape).
residual_relative_strength:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  min_residual_short_bps: 5.0
  min_residual_long_bps: 0.0
  max_sector_rank: 3.0
  min_relative_volume: 1.2
  min_aggressor_imbalance: 0.05
  min_microprice_edge_bps: 0.0
  require_flow_confirmation: true
  min_flow_zscore: 0.0
  max_change_point_probability: 0.5
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 20.0

# VWAP reversion on a volatility-normalised z-score instead of a fixed 25bps band,
# with an upper z bound: past it the move is a repricing, not a displacement, and
# there is no mean left to revert to.
adaptive_anchored_vwap_reversion:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  min_entry_zscore: 2.0
  max_entry_zscore: 6.0
  min_displacement_bps: 15.0
  max_spread_change_5s: 0.0
  min_microprice_edge_bps: 0.0
  max_change_point_probability: 0.4
  target_capture_fraction: 0.6
  max_target_bps: 150.0
  stop_zscore_multiple: 1.5
  trailing_bps: 16.0
  horizon_seconds: 300.0

# Exhaustion reversal triggered by the BOOK turning (OFI slope, depth recovery,
# microprice above mid), not by the price having fallen. Shortest holding window
# in the catalogue: either liquidity returns within minutes or it was not
# exhaustion.
ofi_microprice_exhaustion_reversal:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  shock_return_10s_bps: -35.0
  min_depth_ratio: 1.1
  min_orderbook_imbalance: 0.05
  min_ofi_slope: 0.0
  min_microprice_edge_bps: 0.2
  max_spread_change_5s: 0.0
  min_aggressor_imbalance: -0.25
  max_flow_toxicity: 0.7
  max_change_point_probability: 0.4
  retrace_fraction: 0.35
  stop_buffer_bps: 6.0
  trailing_bps: 14.0
  horizon_seconds: 150.0
