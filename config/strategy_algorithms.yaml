# Per-strategy mechanical entry/exit thresholds.
#
# The ontology (and an authorised GNN) elect ONE symbol and ONE strategy; the
# elected algorithm in src/app/technical/strategy_algorithms.py then owns entry
# timing, stop/target geometry and thesis invalidation. Regime, liquidity,
# volatility and spread admissibility are NOT here — they are resolved once at
# election time and then watched by src/app/trading/strategy_supervisor.py.
#
# Precedence (highest wins), resolved values exposed via AlgorithmConfig.as_dict():
#   1. environment  ALGO_<SECTION>_<KEY>  (upper case)
#   2. this file
#   3. built-in defaults in strategy_algorithms.py
#
# These are STARTING values to be tuned from realized net PnL. They are not
# assumed optimal. KRX round-trip cost (sell tax 20 bps + fees + slippage +
# safety margin) is roughly 28-34 bps and the US round trip is 51-70 bps, so an
# edge below that is rejected — now at the ALGORITHM layer too, not only
# downstream by the ProfitabilityGate (see ``shared.cost_aware_floor_enabled``).
#
# The sell tax is 20 bps (config/trading_costs.json ``sell_tax_rate: 0.002``).
# An earlier version of this comment said 15 bps; the engine always read the
# JSON, so nothing miscalculated, but anyone tuning a threshold against the
# comment would have been 5 bps optimistic on every KRX round trip.

# Optional market-specific overrides live under ``markets.KR`` / ``markets.US``.
# No numeric override is populated until market-scoped forward validation supports
# it; an empty map is intentional and prevents an unvalidated tuning guess from
# changing live behavior. The loader and tests guarantee that future validated
# overrides cannot leak from one venue into the other.
markets:
  KR: {}
  US: {}

# Market intraday momentum: 하루 1회 왕복. KRX 왕복비용 27.8bps 중 20bps가 법정
# 거래세이고 이는 왕복마다 부과되므로, 전략의 왕복 횟수가 엣지만큼 중요하다.
# 변동성 게이트는 논문의 최강 조건이면서 동시에 비용 조건이다 — 조용한 날의
# 마지막 30분은 33bps를 움직이지 않는다. 15:20 종가 단일가 전에 반드시 청산.
market_intraday_momentum:
  # Shadow-only. It has never produced a single training row -- the session clock
  # it reads was hardcoded to KRX, so on US it looked for the opening range while
  # the US market was shut, and on KRX no symbol carried both session windows.
  # That clock is fixed now, which means tonight is the FIRST time this can fire.
  # Granting live authority to a thesis on the same night it becomes able to act,
  # with zero forward outcomes behind it, is exactly what the deployment ladder
  # exists to prevent.
  live_authorized: false
  min_first_half_hour_return_bps: 15.0
  min_first_half_hour_volatility_percentile: 0.6
  max_change_point_probability: 0.5
  trailing_bps: 30.0
  horizon_seconds: 1500.0

# Opening-range breakout, restricted to stocks in play by relative volume.
# The RVOL gate carries the published edge; loosening it below ~1.5 turns this
# into the unrestricted breakout, which the same research finds unprofitable.
opening_range_breakout:
  live_authorized: false
  min_relative_volume: 1.5
  min_breakout_excess_bps: 3.0
  min_aggressor_imbalance: 0.05
  stop_buffer_bps: 8.0
  trailing_bps: 30.0
  horizon_seconds: 7200.0

shared:
  # Fraction of the volatility-implied move we expect to actually capture.
  # Never raise above 1.0; there is deliberately no fabricated alpha floor.
  capture_fraction: 0.5
  # Minimum ticks in the 5s window before any mechanical trigger may fire.
  # HDFSCNT0 quiet-name cadence is commonly two distinct prints per 5 seconds.
  # Two is enough for a causal return and quote/tick-rule flow direction; the
  # cost-aware edge floor still rejects low-information/low-move setups.
  min_tick_count_5s: 2.0
  # Absolute lower bound, used only when the cost config cannot be read. It is
  # NOT the operative floor: with cost_aware_floor_enabled the floor becomes
  # round_trip_cost * cost_floor_multiple + min_net_buffer_bps, resolved per
  # market from config/trading_costs.json — the full configured round trip for
  # that venue, with no additional strategy-selection buffer layered on top.
  #
  # Why this changed: a flat 8 bps let every algorithm fire on edges that could
  # not survive their own round trip, which is exactly the measured pathology
  # (gap_context on KRX: +12.1 bps gross, -15.8 bps net over 65 fills). The
  # trigger layer and the ProfitabilityGate were using different arithmetic, and
  # the trigger layer's was structurally wrong.
  min_expected_edge_bps: 8.0
  cost_aware_floor_enabled: 1.0
  # 1.0 = the edge must cover its round trip exactly once. Raise it to demand
  # the edge exceed cost by a margin; both terms are estimates, so equality is
  # a loss whenever either is off.
  cost_floor_multiple: 1.0
  # The selector already requires net edge > 0 after this full round trip.
  # A second fixed buffer duplicated that decision and is intentionally zero.
  min_net_buffer_bps: 0.0

# Tick order-flow continuation, confirmed by bar trend agreement.
intraday_momentum:
  live_authorized: false
  min_aggressor_imbalance: 0.15
  min_return_5s_bps: 2.0
  horizon_seconds: 180.0
  stop_volatility_multiple: 1.5
  trailing_bps: 12.0
  reverse_aggressor_exit: -0.25

# Structural range break; stop sits at the broken level, not at a bps constant.
breakout_volume:
  live_authorized: false
  min_volume_spike_ratio: 1.5
  min_breakout_excess_bps: 2.0
  acceptance_return_5s_bps: 1.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 300.0
  stop_buffer_bps: 8.0
  trailing_bps: 15.0
  failure_tolerance_bps: 10.0

# Displacement below VWAP; target is VWAP itself, never an arbitrary bps target.
vwap_mean_reversion:
  live_authorized: false
  entry_deviation_bps: 25.0
  max_entry_deviation_bps: 150.0
  max_entry_zscore: 4.0
  max_rsi: 38.0
  max_percent_b: 0.22
  min_recovery_return_5s_bps: 1.0
  min_aggressor_imbalance: 0.05
  min_book_improvement: 0.0
  horizon_seconds: 240.0
  max_horizon_seconds: 5400.0
  stop_volatility_multiple: 2.0
  target_capture_fraction: 0.7
  trailing_bps: 10.0

# Slow-bar recovery for sparse tapes. Unlike vwap_mean_reversion this does not
# infer recovery from sub-second prints: a completed one-minute bar must reclaim
# the fast EMA while MACD turns positive. It remains shadow-only until its own
# market-scoped after-cost outcomes earn automatic promotion.
bar_confirmed_vwap_recovery:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  min_displacement_bps: 75.0
  max_displacement_zscore: 15.0
  max_rsi: 45.0
  min_macd_histogram: 0.0
  min_momentum_persistence: 0.30
  min_liquidity_score: 0.40
  max_spread_bps: 25.0
  target_capture_fraction: 0.50
  stop_volatility_multiple: 2.5
  trailing_bps: 30.0
  horizon_seconds: 5400.0
  # Equal to horizon_seconds: the structural-edge clock resolves to the base
  # horizon unless this is deliberately raised.
  max_horizon_seconds: 5400.0

# Mechanical sub-minute drop; requires the spread to be contracting again.
liquidity_shock_reversal:
  enabled: true
  shadow_enabled: true
  live_authorized: false
  shock_return_10s_bps: -40.0
  max_spread_change_5s: 0.0
  min_aggressor_imbalance: -0.35
  min_orderbook_imbalance: 0.0
  horizon_seconds: 120.0
  retrace_fraction: 0.4
  stop_buffer_bps: 6.0
  trailing_bps: 14.0
  # US-only shadow branch selected from purged 10-minute observations:
  # train +17.5bp, validation +7.6bp, untouched test +7.2bp after costs.
  absorption_us_only: true
  max_absorption_orderbook_imbalance: -0.30
  min_absorption_return_30s_bps: 2.0
  # ``spread_change_5s=0`` is also the fail-closed finite placeholder when the
  # REST-polled US book contributes fewer than two observations in five seconds.
  # Require a measured contraction of at least 1bp; an unavailable change must
  # never be reinterpreted as evidence that displayed supply was absorbed.
  max_absorption_spread_change_5s: -0.01
  absorption_capture_fraction: 0.35
  absorption_horizon_seconds: 600
  max_absorption_horizon_seconds: 3600

# TTL-bounded repricing. Requires a point-in-time event feed; without one the
# algorithm fails closed rather than guessing freshness.
event_momentum:
  live_authorized: false
  min_volume_spike_ratio: 2.0
  min_aggressor_imbalance: 0.10
  exhaustion_return_10s_bps: 120.0
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 20.0

# Requires a cross-sectional rank from the electing layer.
cross_sectional_relative_strength:
  live_authorized: false
  max_sector_rank: 3.0
  min_short_return_bps: 0.0
  min_aggressor_imbalance: 0.05
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 18.0

# Exactly one submode per election; continuation and fade are never blended.
gap_context:
  live_authorized: false
  min_gap_rate: 0.01
  # A gap is an opening-state thesis. Re-evaluating the same previous-close gap
  # through the close/after-hours produced 46 US shadow entries and 46 losses.
  max_minutes_since_session_open: 60.0
  min_volume_spike_ratio: 1.5
  min_aggressor_imbalance: 0.10
  horizon_seconds: 300.0
  fill_capture_fraction: 0.5
  stop_buffer_bps: 10.0
  trailing_bps: 16.0

# Bullish-only RVGI-confirmed breakout above a frozen causal 20-bar box.
rvgi_box_breakout:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  rvgi_period: 10
  box_lookback: 20
  cross_confirm_bars: 3
  entry_buffer_bps: 3.0
  max_extension_bps: 35.0
  min_volume_spike_ratio: 1.5
  min_aggressor_imbalance: 0.05
  min_box_width_pct: 0.002
  max_box_width_pct: 0.04
  target_capture_fraction: 0.5
  max_target_return: 0.012
  stop_buffer_bps: 10.0
  stop_atr_multiple: 1.0
  failure_tolerance_bps: 12.0
  trailing_bps: 15.0
  horizon_seconds: 300

# --- Added for the current high-volatility, flow-driven tape -----------------
# These arms collect shadow evidence and must earn market-scoped promotion. Merely
# registering a new strategy never grants deployment authority.

# Market/sector-neutral leadership. Requires residual returns and an investor-flow
# z-score from the electing layer; without them it fails closed rather than
# reverting to raw return (which is what made the non-residual version a market
# beta ranking in an index-dominated tape).
residual_relative_strength:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  min_residual_short_bps: 5.0
  min_residual_long_bps: 0.0
  max_sector_rank: 3.0
  min_relative_volume: 1.2
  min_aggressor_imbalance: 0.05
  min_microprice_edge_bps: 0.0
  require_flow_confirmation: true
  min_flow_zscore: 0.0
  max_change_point_probability: 0.5
  # Long-only bear-market submode: individual cash equities only. A stock must
  # rise in absolute terms as well as after market/sector beta removal.
  bearish_mode_enabled: true
  bearish_max_market_breadth: 0.45
  bearish_max_market_beta: 0.85
  bearish_min_residual_short_bps: 12.0
  bearish_min_residual_long_bps: 8.0
  bearish_min_absolute_return_bps: 5.0
  bearish_min_vwap_premium_bps: 5.0
  bearish_min_momentum_persistence: 0.55
  bearish_min_relative_volume: 1.30
  bearish_max_change_point_probability: 0.35
  bearish_capture_fraction: 0.35
  bearish_max_target_bps: 250.0
  bearish_stop_volatility_multiple: 1.5
  bearish_trailing_bps: 30.0
  bearish_horizon_seconds: 10800
  horizon_seconds: 420.0
  stop_volatility_multiple: 2.0
  trailing_bps: 20.0

# VWAP reversion on a volatility-normalised z-score instead of a fixed 25bps band,
# with an upper z bound: past it the move is a repricing, not a displacement, and
# there is no mean left to revert to.
adaptive_anchored_vwap_reversion:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  min_entry_zscore: 2.0
  max_entry_zscore: 6.0
  min_displacement_bps: 15.0
  max_spread_change_5s: 0.0
  min_microprice_edge_bps: 0.0
  max_change_point_probability: 0.4
  target_capture_fraction: 0.6
  max_target_bps: 150.0
  stop_zscore_multiple: 1.5
  trailing_bps: 16.0
  horizon_seconds: 300.0

# Exhaustion reversal triggered by the BOOK turning (OFI slope, depth recovery,
# microprice above mid), not by the price having fallen. Shortest holding window
# in the catalogue: either liquidity returns within minutes or it was not
# exhaustion.
ofi_microprice_exhaustion_reversal:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  shock_return_10s_bps: -35.0
  min_depth_ratio: 1.1
  min_orderbook_imbalance: 0.05
  min_ofi_slope: 0.0
  min_microprice_edge_bps: 0.2
  max_spread_change_5s: 0.0
  min_aggressor_imbalance: -0.25
  max_flow_toxicity: 0.7
  max_change_point_probability: 0.4
  retrace_fraction: 0.35
  stop_buffer_bps: 6.0
  trailing_bps: 14.0
  horizon_seconds: 150.0

# ---------------------------------------------------------------------------
# Indicator family periods.
#
# Formulas live in app.features.indicator_engine (single source); these are only
# the periods. Values are the conventional defaults for each indicator, NOT tuned
# thresholds — nothing here has been fitted, so treating any of it as calibrated
# would be a fabricated edge. Threshold tuning belongs with the family scoring
# work, which is not wired yet (see docs/validation.md §11).
#
# Every function returns None on insufficient data, so raising a period here
# lengthens warmup rather than silently degrading a value to a neutral number.
# ---------------------------------------------------------------------------
indicator_families:
  moving_average:
    sma_windows: [5, 10, 20, 60]
    ema_windows: [5, 12, 20, 26, 60]
    alignment_windows: [5, 20, 60]
    slope_lookback_bars: 1
    disparity_window: 20
  envelope:
    window: 20
    percentage: 0.02
    use_ema: false
  bollinger:
    period: 20
    num_std: 2.0
  ichimoku:
    # Causal only: the chart's 26-bar forward-shifted cloud is never fed to a
    # model. senkou_a/b are the values computable at decision_time.
    tenkan_period: 9
    kijun_period: 26
    senkou_b_period: 52
  trendline:
    # Rolling OLS on log close. Pivot-based trendlines are deliberately avoided:
    # a pivot is only confirmed by bars to its right, which is look-ahead online.
    window: 60
    support_quantile: 0.10
    resistance_quantile: 0.90
  trend_auxiliary:
    macd: {fast: 12, slow: 26, signal: 9}
    dmi_period: 14
    trix: {period: 15, signal_period: 9}
  volatility:
    atr_period: 14
    atr_expansion_baseline_multiple: 3
  strength_and_flow:
    cci_period: 20
    mfi_period: 14
    obv_slope_window: 20
    obv_zscore_window: 20
    volume_zscore_window: 20
    relative_volume_window: 20
  momentum:
    momentum_period: 10
    roc_periods: [5, 10, 20]
    rsi_period: 14
    stochastic: {period: 14, signal: 3}
    williams_r_period: 14

# Overnight gap carry: the only window whose move clears a US round trip.
# Measured on the stored US tape -- median |move| 6.7bps over 3 minutes, 16.4 over
# 30, and 69.1 over the overnight gap against a 51.2bps round trip. Magnitude is
# measured; DIRECTION is not (unconditional overnight mean +15.6bps, below cost),
# so this is shadow-only until forward outcomes say otherwise.
# --- SHORT theses: disabled at the ALGORITHM layer too ----------------------- #
# Operator instruction 2026-08-11: this account cannot trade derivatives or leveraged
# products, and short selling (공매도/대주) sits behind the same separate
# authorisation. The system is LONG-ONLY.
#
# config/short_strategy_deployment.yaml already stops the promotion controller and
# disables each arm, and RiskRules.short_selling_allowed is false. This is the third
# layer, and it is not redundant: the deployment ladder governs the tradable ARM while
# these flags govern the ALGORITHM, and leaving the algorithm authorised meant
# `strategy_live_authorized()` still answered True for all three.
market_intraday_momentum_short:
  enabled: false
  shadow_enabled: false
  paper_enabled: false
  live_authorized: false
opening_range_breakdown:
  enabled: false
  shadow_enabled: false
  paper_enabled: false
  live_authorized: false
residual_relative_weakness:
  enabled: false
  shadow_enabled: false
  paper_enabled: false
  live_authorized: false

# Range-floor reversion. ONE condition: price within 10bps of its own 20-bar
# Donchian floor. Long-only, bar-based, no tick term.
#
# Read the evidence before tuning anything here. From a screen of nine candidate LONG
# conditions over the full stored KRX minute tape, scored against the unconditional
# first-touch baseline on these same barriers:
#
#   all stored symbols        n=207  -2.3bps vs -28.2 baseline   t=3.01
#   tradable instruments only n=119 -10.7bps vs -27.7 baseline   t=1.56
#   tradable, data-rich half  n=108  -8.0bps vs -15.7 baseline   t=0.65
#
# The significance was carried substantially by leveraged and inverse ETPs, which this
# account cannot order. On tradable names it is not distinguishable from buying at
# random, and it is still NEGATIVE in absolute terms. It is live by operator decision,
# not because it was validated.
#
# Two apparent omissions are measured, not oversights:
#   * no upturn confirmation — requiring close>open moved it to -35.8bps (n 207->38)
#   * no RSI gate — oversold alone was t=1.48; the floor proximity alone was t=3.01
#
# Changing max_low_distance_bps or horizon_seconds voids the measurement above.
range_support_reversion:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  # Stored tradable-universe evidence is negative and statistically inconclusive.
  # Keep collecting counterfactual outcomes, but do not let an operator-added thesis
  # bypass the same positive-net validation required from every other strategy.
  live_authorized: false
  max_low_distance_bps: 10.0
  horizon_seconds: 3600.0
  min_attainable_bps: 160.0
  target_capture_fraction: 0.5
  stop_volatility_multiple: 2.0
  trailing_bps: 30.0
  max_spread_bps: 30.0
  min_liquidity_score: 0.35

overnight_gap_carry:
  enabled: true
  shadow_enabled: true
  paper_enabled: true
  live_authorized: false
  overnight_variance_minutes: 532.0
  max_minutes_to_close: 20.0
  min_vwap_premium_bps: 10.0
  min_momentum_persistence: 0.55
  min_aggressor_imbalance: 0.10
  max_change_point_probability: 0.5
  stop_volatility_multiple: 3.0
  trailing_bps: 45.0
  horizon_seconds: 64800.0

# Multi-hour, completed-bar continuation. It intentionally does not read 1s/5s
